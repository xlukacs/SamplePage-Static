<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sample Test Page | Static Site</title><link rel="stylesheet" href="/style.css"><script src="/sample.js" defer></script></head>
<body><main>
<h1>Sample Test Page</h1><p>Served by Static Site.</p>
<section><h2>Counter</h2><output id="count" aria-live="polite">0</output><button id="decrease">Decrease</button><button id="increase">Increment</button><button id="reset">Reset</button></section>
<section><h2>Greeting</h2><label for="name">Your name</label><input id="name"><output id="greeting" aria-live="polite">Hello, stranger!</output></section>
<section><h2>Theme</h2><button id="mode" aria-pressed="false">Dark mode off</button></section>
</main></body></html>
